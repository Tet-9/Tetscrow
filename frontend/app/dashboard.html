<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Tet</title>
<link rel="stylesheet" href="../css/styles.css" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a href="../index.html" class="brand" style="padding:10px 14px; margin-bottom:12px;"><span class="brand-mark"></span> Tet</a>
    <a href="index.html">Home</a>
    <a href="dashboard.html" class="active">Dashboard</a>
    <a href="create-escrow.html">Create Agreement</a>
    <a href="disputes.html">Disputes</a>
    <a href="../index.html#token">$TET Token</a>
    <div style="margin-top:auto; padding-top:20px;">
      <button class="btn btn-primary" style="width:100%;" onclick="connect()">Connect Wallet</button>
      <div class="wallet-pill" data-wallet-pill style="margin-top:10px; justify-content:center;">Not connected</div>
    </div>
  </aside>

  <main id="gate"></main>

  <main class="app-main" id="content" style="display:none">
    <div class="page-head">
      <h1>Your Escrow Agreements</h1>
      <a href="create-escrow.html" class="btn btn-primary btn-sm">+ New Agreement</a>
    </div>

    <table class="table" id="escrow-table">
      <thead>
        <tr><th>Title</th><th>Counterparty</th><th>Amount</th><th>Status</th><th>Created</th></tr>
      </thead>
      <tbody id="escrow-rows"></tbody>
    </table>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../js/hawk3d.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/wallet.js"></script>
<script src="../js/api.js"></script>
<script>
  const gate = document.getElementById("gate"), content = document.getElementById("content");
  function showGate() {
    gate.style.display = "block"; content.style.display = "none";
    gate.innerHTML = '<div class="gate"><div class="hawk-slot" data-scene="computer" data-img="../assets/hawk-computer.png" aria-label="Hawk at a computer terminal"></div>' +
      '<p>Authorization required, please connect wallet to begin.</p>' +
      '<button class="btn btn-primary" onclick="connect()">Connect Wallet</button></div>';
    if (window.Hawk3D) window.Hawk3D.scan(gate);
  }
  async function connect() {
    try {
      const ok = await Tet.signInWithEthereum();
      if (ok) { gate.style.display = "none"; content.style.display = "block"; loadEscrows(); }
    } catch (e) { alert("Couldn't sign in. Is the Tet server running?"); }
  }

  async function loadEscrows() {
    const rowsEl = document.getElementById("escrow-rows");
    try {
      const escrows = await TetApi.myEscrows();
      const me = (localStorage.getItem("tet_wallet") || "").toLowerCase();
      if (!escrows.length) {
        rowsEl.innerHTML = `<tr><td colspan="5" style="color:var(--text-dim);">No agreements yet — create your first one.</td></tr>`;
        return;
      }
      rowsEl.innerHTML = escrows.map((e) => {
        const counterparty = e.sender_address.toLowerCase() === me ? e.receiver_address : e.sender_address;
        return `<tr onclick="location.href='escrow-detail.html?id=${e.id}'" style="cursor:pointer;">
          <td>${e.title}</td>
          <td>${counterparty.slice(0,6)}...${counterparty.slice(-4)}</td>
          <td>${e.amount} ${symbolForToken(e.token_address)}</td>
          <td><span class="badge ${e.status}">${e.status}</span></td>
          <td>${new Date(e.created_at).toLocaleDateString()}</td>
        </tr>`;
      }).join("");
    } catch (err) {
      rowsEl.innerHTML = `<tr><td colspan="5" style="color:var(--danger);">Could not load agreements — sign in with your wallet first.</td></tr>`;
    }
  }

  if (localStorage.getItem("tet_jwt")) { content.style.display = "block"; loadEscrows(); } else { showGate(); }
</script>
</body>
</html>
